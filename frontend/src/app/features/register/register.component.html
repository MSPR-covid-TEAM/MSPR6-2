<div class="container">
  <h1>Inscription</h1>
  <form (ngSubmit)="onRegister()">
    <div class="form-group">
      <label for="nom">Nom :</label>
      <input id="nom" name="nom" [(ngModel)]="nom" required type="text" />
    </div>
    <div class="form-group">
      <label for="prenom">Prénom :</label>
      <input id="prenom" name="prenom" [(ngModel)]="prenom" required type="text" />
    </div>
    <div class="form-group">
      <label for="email">Email :</label>
      <input id="email" name="email" [(ngModel)]="email" required type="email" />
    </div>
    <div class="form-group">
      <label for="password">Mot de passe :</label>
      <input id="password" name="password" [(ngModel)]="password" required type="password" />
    </div>
    <div class="form-group">
      <label for="lang">Langue / Cluster :</label>
      <select id="lang" name="lang" [(ngModel)]="lang" required>
        <option value="" disabled selected>Choisir...</option>
        <option value="France">France</option>
        <option value="UnitedState">États-Unis</option>
        <option value="Suisse(fr)">Suisse (Français)</option>
        <option value="Suisse(en)">Suisse (Anglais)</option>
        <option value="Suisse(de)">Suisse (Allemand)</option>
        <option value="Suisse(it)">Suisse (Italien)</option>
      </select>
    </div>
    <button type="submit">S'inscrire</button>
    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
  <p>Déjà inscrit ? <a href="/connexion">Se connecter</a></p>
</div>
