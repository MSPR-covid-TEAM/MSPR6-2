<img src="oms-logo.png" alt="oms logo" width="20%" height="auto">

<ng-container *ngIf="!isLoggedIn() || !isClusterRoute()">
  <!-- Google Translate Element -->
<div id="google_translate_element" aria-label="Zone de sélection de la langue" style="position:fixed;top:10px;right:10px;z-index:9999;background:#fff;padding:4px 8px;border-radius:6px;"></div>

  <!-- NAVBAR PRINCIPALE -->
  <nav class="navbar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <img src="https://snpl.com/wp-content/uploads/2020/04/logo-oms-2.png"
        style="height: 40px; width: auto; max-height: 100%; filter: brightness(0) invert(1);" alt="Logo OMS">
      <span class="logo" style="color: white; font-weight: bold;">OMS</span>
    </div>
    <!-- Menu burger icon -->
    <div class="burger" (click)="toggleMenu()">
      &#9776;
    </div>

    <div class="nav-links" [class.open]="menuOpen">
      <!-- <a routerLink="/connexion" *ngIf="!isLoggedIn()">Connexion</a>
      <a routerLink="/register" *ngIf="!isLoggedIn()">Inscription</a> -->
      <a href="#" (click)="redirection()" *ngIf="isLoggedIn()">Mon espace</a>
      <a href="#" (click)="logout()" *ngIf="isLoggedIn()">Déconnexion</a>
    </div>
  </nav>
</ng-container>

<!-- Contenu des pages -->
<router-outlet></router-outlet>
