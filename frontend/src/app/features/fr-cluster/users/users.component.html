<app-fr></app-fr>
<div class="container">
  <h1 class="title">Utilisateurs</h1>
  <div class="feedback" *ngIf="feedback">{{ feedback }}</div>

  <div class="users-list">
    <div class="user-card" *ngFor="let user of users">
      <ng-container *ngIf="editingId !== user.id_user; else editForm">
        <div class="user-info">
          <div><strong>Nom :</strong> {{ user.nom }}</div>
          <div><strong>Prénom :</strong> {{ user.prenom }}</div>
          <div><strong>Email :</strong> {{ user.email }}</div>
        </div>
        <div class="actions">
          <button *ngIf="connectedUserId === user.id_user" (click)="startEdit(user)">Modifier</button>
          <button class="delete-btn" (click)="deleteUser(user)">Supprimer</button>
        </div>
      </ng-container>
      <ng-template #editForm>
        <form (ngSubmit)="saveEdit()" class="edit-form">
          <input type="text" [(ngModel)]="editUser.nom" name="nom" required placeholder="Nom" />
          <input type="text" [(ngModel)]="editUser.prenom" name="prenom" required placeholder="Prénom" />
          <input type="email" [(ngModel)]="editUser.email" name="email" required placeholder="Email" />
          <select [(ngModel)]="editUser.lang" name="lang" required>
            <option value="" disabled>Sélectionner la langue</option>
            <option value="France">France</option>
            <option value="UnitedState">United State</option>
            <option value="Suisse">Suisse</option>
          </select>
          <input type="password" [(ngModel)]="editUser.password" name="password" minlength="6" placeholder="Nouveau mot de passe (optionnel)" />
          <div class="edit-actions">
            <button type="submit">Enregistrer</button>
            <button type="button" (click)="cancelEdit()">Annuler</button>
          </div>
        </form>
      </ng-template>
    </div>
  </div>
</div>
